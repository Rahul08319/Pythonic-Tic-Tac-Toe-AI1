
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pythonic Tic-Tac-Toe AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fira Code', monospace;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            overflow-x: hidden;
        }

        @keyframes win-glow {
          0% { box-shadow: 0 0 5px rgba(34, 211, 238, 0.5); border-color: rgba(34, 211, 238, 0.5); }
          50% { box-shadow: 0 0 20px rgba(34, 211, 238, 0.8); border-color: rgba(34, 211, 238, 1); }
          100% { box-shadow: 0 0 5px rgba(34, 211, 238, 0.5); border-color: rgba(34, 211, 238, 0.5); }
        }

        @keyframes symbol-pulse {
          0% { transform: scale(1.1); }
          50% { transform: scale(1.3); }
          100% { transform: scale(1.1); }
        }

        @keyframes ai-highlight {
          0% { background-color: rgba(168, 85, 247, 0); }
          20% { background-color: rgba(168, 85, 247, 0.3); }
          100% { background-color: rgba(168, 85, 247, 0); }
        }

        @keyframes stalemate-shake {
          0% { transform: translateX(0); }
          25% { transform: translateX(-2px); }
          50% { transform: translateX(2px); }
          75% { transform: translateX(-2px); }
          100% { transform: translateX(0); }
        }

        @keyframes fade-in-out {
          0% { opacity: 0; transform: translateY(10px); }
          20% { opacity: 1; transform: translateY(0); }
          80% { opacity: 1; transform: translateY(0); }
          100% { opacity: 0; transform: translateY(-10px); }
        }

        .winning-square {
          animation: win-glow 1.5s infinite;
          z-index: 10;
        }

        .winning-symbol {
          animation: symbol-pulse 1.5s infinite ease-in-out;
          display: inline-block;
        }

        .ai-pulse {
          animation: ai-highlight 1s ease-out forwards;
        }

        .stalemate-active {
          animation: stalemate-shake 0.2s infinite;
          border-color: #94a3b8 !important;
        }

        .draw-message {
          animation: fade-in-out 3s forwards;
        }

        .board-transition-enter {
          opacity: 0;
          transform: scale(0.95);
        }
        .board-transition-enter-active {
          opacity: 1;
          transform: scale(1);
          transition: opacity 300ms, transform 300ms;
        }

        .tooltip {
          position: relative;
          display: inline-block;
        }

        .tooltip .tooltiptext {
          visibility: hidden;
          width: 200px;
          background-color: #1e293b;
          color: #cbd5e1;
          text-align: center;
          border-radius: 6px;
          padding: 8px;
          position: absolute;
          z-index: 50;
          bottom: 125%;
          left: 50%;
          margin-left: -100px;
          opacity: 0;
          transition: opacity 0.3s;
          font-size: 0.75rem;
          border: 1px solid #334155;
          pointer-events: none;
        }

        .tooltip:hover .tooltiptext {
          visibility: visible;
          opacity: 1;
        }

        .scrollbar-hide::-webkit-scrollbar {
          display: none;
        }
        .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>

<script type="module" src="/index.tsx"></script>
</body>
</html>
